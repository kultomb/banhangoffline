[package]
name = "hangho-pos-desktop"
version = "1.0.2"
description = "HangHoa POS — Phần mềm quản lý bán hàng offline dành cho Windows"
authors = ["HangHoa POS"]
edition = "2021"

[lib]
name = "hangho_pos_desktop"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri              = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-fs    = "2"
tauri-plugin-dialog = "2"
tauri-plugin-process = "2"
tauri-plugin-window-state = "2"
serde              = { version = "1", features = ["derive"] }
serde_json         = "1"

# License system dependencies have been removed.

[target.'cfg(windows)'.dependencies]
winreg             = "0.52"

# Tối ưu build release: nhỏ + nhanh
[profile.release]
panic         = "abort"
codegen-units = 1
lto           = true
opt-level     = "s"
strip         = true

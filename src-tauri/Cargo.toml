[package]
name = "hangho-pos"
version = "1.0.2"
description = "Hangho POS — Quản lý bán hàng offline"
authors = []
edition = "2021"

[lib]
name = "hangho_pos_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri         = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-fs    = "2"
tauri-plugin-dialog = "2"
serde         = { version = "1", features = ["derive"] }
serde_json    = "1"

[profile.release]
panic        = "abort"
codegen-units = 1
lto          = true
opt-level    = "s"
strip        = true
